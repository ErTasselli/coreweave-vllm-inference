# -----------------------------------------------------------------------------
# secret-template.yaml  (TEMPLATE — do not put real values in git!)
#
# Copy this file to secret.yaml, fill in real values, apply it, and never
# commit it (secret.yaml is git-ignored):
#
#   cp secret-template.yaml secret.yaml
#   $EDITOR secret.yaml
#   kubectl apply -n ai-inference -f secret.yaml
#
# Or create it entirely from the CLI (preferred — nothing touches disk):
#
#   kubectl create secret generic inference-secrets -n ai-inference \
#     --from-literal=HUGGING_FACE_HUB_TOKEN=hf_xxxxxxxxxxxxxxxx \
#     --from-literal=VLLM_API_KEY=$(openssl rand -hex 32)
#
# For production-grade setups, prefer External Secrets Operator or Sealed
# Secrets so the real values live in a vault, not in kubectl history.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: inference-secrets
  labels:
    app.kubernetes.io/part-of: ai-inference
    app.kubernetes.io/component: config
type: Opaque
stringData:
  # Hugging Face token — required for gated models (Llama, Mistral, ...).
  HUGGING_FACE_HUB_TOKEN: "CHANGE_ME__hf_token"

  # Bearer token clients must send to the OpenAI-compatible API.
  # vLLM reads this automatically from the VLLM_API_KEY env var.
  VLLM_API_KEY: "CHANGE_ME__random_api_key"
